<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background subtle gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141829" />
      <stop offset="100%" stop-color="#0a0c14" />
    </radialGradient>

    <!-- Spectrum Prism Gradients -->
    <linearGradient id="spectrumLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#00bbf9" />
    </linearGradient>

    <linearGradient id="spectrumRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b2cbf" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>

    <linearGradient id="spectrumBottom" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00bbf9" />
      <stop offset="50%" stop-color="#7b2cbf" />
      <stop offset="100%" stop-color="#fee440" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />

  <!-- Outer Isometric Cube / Prism Outline (The "Spectra" Crystal) -->
  <g transform="translate(256, 230)">
    <!-- Top Face -->
    <polygon points="0,-140 120,-70 0,0 -120,-70" fill="url(#spectrumLeft)" opacity="0.9" />

    <!-- Left Face -->
    <polygon points="-120,-70 0,0 0,140 -120,70" fill="url(#spectrumBottom)" opacity="0.85" />

    <!-- Right Face -->
    <polygon points="0,0 120,-70 120,70 0,140" fill="url(#spectrumRight)" opacity="0.95" />

    <!-- Inner Core: Glowing energy crystal / cube -->
    <g filter="url(#coreGlow)">
      <!-- Inner Core Top -->
      <polygon points="0,-50 44,-25 0,0 -44,-25" fill="#ffffff" opacity="0.95" />
      <!-- Inner Core Left -->
      <polygon points="-44,-25 0,0 0,50 -44,25" fill="#00f5d4" opacity="0.9" />
      <!-- Inner Core Right -->
      <polygon points="0,0 44,-25 44,25 0,50" fill="#ff007f" opacity="0.9" />
    </g>
  </g>

  <!-- Clean Minimalist Typography -->
  <text x="256" y="435" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" letter-spacing="6" fill="#ffffff">
    SPECTRA<tspan fill="#00f5d4">CORE</tspan>
  </text>
  <text x="256" y="465" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" letter-spacing="4" fill="#6c7a9c">
    HIGH-PERFORMANCE MINECRAFT ENGINE
  </text>
</svg>
